services:
  hadoop:
    build: ./hadoop
    volumes:
      - ${DATASET_PATH}:/data/input/dataset.csv:ro
      - hadoop_out:/data/output
      - sshkeys:/keys
      - ./mapreduce:/home/hadoopuser/mapreduce:ro
    networks: [datamart]

  db:
    image: postgres:16
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [datamart]

  api:
    build: ./api
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - hadoop_out:/data/output:ro
      - sshkeys:/keys:ro
      - ./scripts:/scripts:ro
    networks: [datamart]

volumes:
  pgdata:
  hadoop_out:
  sshkeys:

networks:
  datamart:
